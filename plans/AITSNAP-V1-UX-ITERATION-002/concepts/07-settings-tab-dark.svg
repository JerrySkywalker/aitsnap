<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#151d29" /><rect x="0" y="0" width="1600" height="74" rx="0" fill="#1e2938" /><g transform="translate(22 15) scale(.68)"><rect width="64" height="64" rx="16" fill="#2364d2" /><g fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"><path d="M15 25V15h10M39 15h10v10M49 39v10H39M25 49H15V39" /><rect x="23" y="23" width="18" height="18" rx="3" /></g></g><text x="80" y="46" font-size="27" fill="#e6edf6" font-weight="700">AITSnap</text><text x="250" y="45" font-size="20" fill="#a5b4c7" font-weight="400">多屏证据工作台</text><text x="1110" y="44" font-size="17" fill="#a5b4c7" font-weight="400">概念草案 / 待审 · 合成示例 · 未实现</text><rect x="0" y="76" width="184" height="924" rx="0" fill="#192331" /><text x="32" y="131" font-size="20" fill="#a5b4c7" font-weight="400">工作台</text><text x="32" y="191" font-size="20" fill="#a5b4c7" font-weight="400">源区域</text><text x="32" y="251" font-size="20" fill="#a5b4c7" font-weight="400">拼图场景</text><text x="32" y="311" font-size="20" fill="#a5b4c7" font-weight="400">批次与报告</text><rect x="12" y="340" width="160" height="46" rx="8" fill="#304e78" /><text x="32" y="371" font-size="20" fill="#82b4ff" font-weight="600">设置</text><text x="23" y="903" font-size="13" fill="#a5b4c7" font-weight="400">图标为同一母版草案</text><text x="23" y="930" font-size="13" fill="#a5b4c7" font-weight="400">并非最终品牌批准</text><text x="214" y="122" font-size="30" fill="#e6edf6" font-weight="700">设置 · 调整选项，同时看清结果</text><text x="214" y="155" font-size="18" fill="#a5b4c7" font-weight="400">当前配置：试验记录 · 设置保存后应用到后续操作</text><rect x="212" y="185" width="244" height="704" rx="12" fill="#1e2938" stroke="#3b4b61" /><text x="234" y="224" font-size="22" fill="#e6edf6" font-weight="700">设置分类</text><rect x="226" y="249" width="216" height="44" rx="7" fill="#304e78" /><text x="242" y="278" font-size="19" fill="#82b4ff" font-weight="600">常用设置</text><text x="242" y="336" font-size="19" fill="#a5b4c7" font-weight="400">保存与命名</text><text x="242" y="394" font-size="19" fill="#a5b4c7" font-weight="400">快捷键与托盘</text><text x="242" y="452" font-size="19" fill="#a5b4c7" font-weight="400">Word 报告</text><text x="242" y="510" font-size="19" fill="#a5b4c7" font-weight="400">元数据关联</text><text x="242" y="568" font-size="19" fill="#a5b4c7" font-weight="400">关于 AITSnap</text><text x="234" y="791" font-size="16" fill="#a5b4c7" font-weight="400">所有内容仅保存在本机</text><rect x="476" y="185" width="678" height="704" rx="12" fill="#1e2938" stroke="#3b4b61" /><text x="500" y="224" font-size="23" fill="#e6edf6" font-weight="700">保存与常用操作</text><text x="500" y="260" font-size="16" fill="#a5b4c7" font-weight="400">保存目录</text><rect x="500" y="272" width="480" height="38" rx="6" fill="#1e2938" stroke="#3b4b61" /><text x="512" y="298" font-size="18" fill="#e6edf6" font-weight="400">D:\试验证据</text><rect x="998" y="272" width="132" height="42" rx="8" fill="#1e2938" stroke="#3b4b61" /><text x="1014" y="300" font-size="18" fill="#e6edf6" font-weight="600">浏览目录</text><text x="500" y="334" font-size="16" fill="#a5b4c7" font-weight="400">图片格式</text><rect x="500" y="346" width="194" height="38" rx="6" fill="#1e2938" stroke="#3b4b61" /><text x="512" y="372" font-size="18" fill="#e6edf6" font-weight="400">PNG  ▾</text><text x="716" y="334" font-size="16" fill="#a5b4c7" font-weight="400">文件命名</text><rect x="716" y="346" width="414" height="38" rx="6" fill="#1e2938" stroke="#3b4b61" /><text x="728" y="372" font-size="18" fill="#e6edf6" font-weight="400">{sequence}_{region}</text><text x="500" y="411" font-size="16" fill="#a5b4c7" font-weight="400">复制哪张图</text><rect x="500" y="423" width="630" height="38" rx="6" fill="#1e2938" stroke="#3b4b61" /><text x="512" y="449" font-size="18" fill="#e6edf6" font-weight="400">区域 #1 · 电压曲线  ▾</text><path d="M500 480L1130 480" stroke="#3b4b61" 