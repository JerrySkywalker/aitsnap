>串口日志</text><rect x="898" y="460" width="170" height="35" rx="6" fill="white" stroke="#d9e2eb"/><rect x="902" y="463" width="30" height="30" rx="9" fill="#2364d2"/><text x="911" y="485" font-size="18" fill="white" font-weight="700">3</text><text x="940" y="485" font-size="17" fill="#17283d" font-weight="400">相机画面</text><rect x="898" y="612" width="170" height="35" rx="6" fill="white" stroke="#d9e2eb"/><rect x="902" y="615" width="30" height="30" rx="9" fill="#2364d2"/><text x="911" y="637" font-size="18" fill="white" font-weight="700">4</text><text x="940" y="637" font-size="17" fill="#17283d" font-weight="400">电源状态</text><rect x="540" y="726" width="692" height="67" rx="8" fill="#e8f5f2"/><text x="556" y="754" font-size="17" fill="#127f74" font-weight="600">编辑器标签：独立清晰，跟随图层定位，不随图片拉伸</text><text x="556" y="780" font-size="16" fill="#127f74" font-weight="400">以上编号框仅用于编辑；默认不会写入导出 PNG</text><text x="540" y="845" font-size="17" fill="#52677e" font-weight="400">缩放 50%   ·   文字保持可读   ·   原图不会被改写</text><rect x="1278" y="185" width="296" height="710" rx="12" fill="white" stroke="#d9e2eb"/><text x="1298" y="222" font-size="22" fill="#17283d" font-weight="700">#1 电压曲线</text><text x="1298" y="264" font-size="16" fill="#52677e" font-weight="400">源图实际尺寸</text><text x="1298" y="293" font-size="21" fill="#17283d" font-weight="400">1200×200</text><text x="1298" y="326" font-size="16" fill="#52677e" font-weight="400">当前框选尺寸</text><text x="1298" y="355" font-size="21" fill="#17283d" font-weight="400">1200×200</text><text x="1298" y="388" font-size="16" fill="#52677e" font-weight="400">目标布局框</text><text x="1298" y="417" font-size="21" fill="#17283d" font-weight="400">1540×260</text><text x="1298" y="465" font-size="20" fill="#127f74" font-weight="600">✓ 等比适配</text><text x="1298" y="498" font-size="16" fill="#52677e" font-weight="400">保留图片比例，必要时留白</text><text x="1298" y="556" font-size="19" fill="#17283d" font-weight="600">编辑器身份标签</text><text x="1298" y="587" font-size="17" fill="#52677e" font-weight="400">始终清晰 · 不导出</text><text x="1298" y="650" font-size="19" fill="#17283d" font-weight="600">输出标题</text><text x="1298" y="683" font-size="17" fill="#52677e" font-weight="400">□ 将区域名称作为标题</text><text x="1298" y="713" font-size="16" fill="#52677e" font-weight="400">启用后在最终分辨率排版</text><text x="1298" y="801" font-size="16" fill="#52677e" font-weight="400">高级：裁剪 / 旋转 / Z</text><rect x="840" y="925" width="170" height="42" rx="8" fill="white" stroke="#d9e2eb"/><text x="856" y="953" font-size="18" fill="#17283d" font-weight="600">预览导出文件</text><rect x="1026" y="925" width="168" height="42" rx="8" fill="white" stroke="#d9e2eb"/><text x="1042" y="953" font-size="18" fill="#17283d" font-weight="600">取消</text><rect x="1210" y="925" width="364" height="42" rx="8" fill="#2364d2"/><text x="1226" y="953" font-size="18" fill="white" font-weight="600">保存场景：试验总览</text></svg>