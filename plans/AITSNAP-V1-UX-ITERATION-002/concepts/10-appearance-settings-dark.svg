<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#151d29" /><rect x="0" y="0" width="1600" height="74" rx="0" fill="#1e2938" /><g transform="translate(22 15) scale(.68)"><rect width="64" height="64" rx="16" fill="#2364d2" /><g fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"><path d="M15 25V15h10M39 15h10v10M49 39v10H39M25 49H15V39" /><rect x="23" y="23" width="18" height="18" rx="3" /></g></g><text x="80" y="46" font-size="27" fill="#e6edf6" font-weight="700">AITSnap</text><text x="250" y="45" font-size="20" fill="#a5b4c7" font-weight="400">多屏证据工作台</text><text x="1110" y="44" font-size="17" fill="#a5b4c7" font-weight="400">概念草案 / 待审 · 合成示例 · 未实现</text><rect x="0" y="76" width="184" height="924" rx="0" fill="#192331" /><text x="32" y="131" font-size="20" fill="#a5b4c7" font-weight="400">工作台</text><text x="32" y="191" font-size="20" fill="#a5b4c7" font-weight="400">源区域</text><text x="32" y="251" font-size="20" fill="#a5b4c7" font-weight="400">拼图场景</text><text x="32" y="311" font-size="20" fill="#a5b4c7" font-weight="400">批次与报告</text><rect x="12" y="340" width="160" height="46" rx="8" fill="#304e78" /><text x="32" y="371" font-size="20" fill="#82b4ff" font-weight="600">设置</text><text x="23" y="903" font-size="13" fill="#a5b4c7" font-weight="400">图标为同一母版草案</text><text x="23" y="930" font-size="13" fill="#a5b4c7" font-weight="400">并非最终品牌批准</text><text x="214" y="122" font-size="30" fill="#e6edf6" font-weight="700">设置 · 外观</text><text x="214" y="155" font-size="18" fill="#a5b4c7" font-weight="400">AITSnap 0.7.0 · 配色立即生效，语言更改在下次启动生效</text><rect x="212" y="185" width="244" height="704" rx="12" fill="#1e2938" stroke="#3b4b61" /><text x="234" y="224" font-size="22" fill="#e6edf6" font-weight="700">设置分类</text><text x="242" y="278" font-size="19" fill="#a5b4c7" font-weight="400">常用设置</text><rect x="226" y="307" width="216" height="44" rx="7" fill="#304e78" /><text x="242" y="336" font-size="19" fill="#82b4ff" font-weight="600">外观</text><text x="242" y="394" font-size="19" fill="#a5b4c7" font-weight="400">保存与命名</text><text x="242" y="452" font-size="19" fill="#a5b4c7" font-weight="400">快捷键与托盘</text><text x="242" y="510" font-size="19" fill="#a5b4c7" font-weight="400">Word 报告</text><text x="242" y="568" font-size="19" fill="#a5b4c7" font-weight="400">元数据关联</text><text x="242" y="626" font-size="19" fill="#a5b4c7" font-weight="400">关于 AITSnap</text><rect x="476" y="185" width="678" height="704" rx="12" fill="#1e2938" stroke="#3b4b61" /><text x="500" y="224" font-size="23" fill="#e6edf6" font-weight="700">界面语言</text><rect x="500" y="253" width="190" height="56" rx="12" fill="#304e78" stroke="#82b4ff" /><text x="516" y="289" font-size="19" fill="#82b4ff" font-weight="400">● 跟随系统</text><rect x="710" y="253" width="190" height="56" rx="12" fill="#192331" stroke="#3b4b61" /><text x="726" y="289" font-size="19" fill="#e6edf6" font-weight="400">○ 简体中文</text><rect x="920" y="253" width="190" height="56" rx="12" fill="#192331" stroke="#3b4b61" /><text x="936" y="289" font-size="19" fill="#e6edf6" font-weight="400">○ English</text><text x="500" y="347" font-size="17" fill="#a5b4c7" font-weight="400">语言在下次启动生效，截图和已有文件名称保持原样。</text><path d="M500 377L1130 377" stroke="#3b4b61" stroke-width="1" /><text x="500" y="419" font-size="23" fill="#e6edf6" font-weight="700">色彩模式</text><g data-fixed-colors="true"><rect x="500" y="447" width="190" height="130" rx="12" fill="#edf2f7" stroke="#d9e2eb" /><rect x="515" y="465" width="160" height="62" rx="6" fill="white" /><rect x="526" y="478" width="38" height="36" rx="5" fill="#2364d2" /><text x="577" y="503" font-size="23" fill="#17283d" font-weight="700">Aa</text><text x="516" y="558" font-size="18" fill="#17283d" font-weight="400">○ 浅色</text></g><g data-fixed-colors="true"><rect x="710" y="447" width="190" height="130" rx="12" fill="#151d29" stroke="#d9e2eb" /><rect x="725" y="465" width="160" height="62" rx="6" fill="#1e2938" /><rect x="736" y="478" width="38" height="36" rx="5" fill="#2364d2" /><text x="787" y="503" font-size="23" fill="#e6edf6" font-weight="700">Aa</text><text x="726" y="558" font-size="18" fill="#e6edf6" font-weight="400">○ 深色</text></g><g data-fixed-colors="true"><rect x="920" y="447" width="190" height="130" rx="12" fill="#e4edff" stroke="#2364d2" /><rect x="935" y="465" width="160" height="62" rx="6" fill="white" /><rect x="946" y="478" width="38" height="36" rx="5" fill="#2364d2" /><text x="997" y="503" font-size="23" fill="#17283d" font-weight="700">Aa</text><text x="936" y="558" font-size="18" fill="#17283d" font-weight="400">● 跟随系统</text></g><text x="500" y="622" font-size="17" fill="#a5b4c7" font-weight="400">配色只改变软件界面，不改变截图或拼图输出的像素。</text><text x="500" y="661" font-size="17" fill="#a5b4c7" font-weight="400">跟随系统会响应 Windows 应用颜色设置的变化。</text><rect x="500" y="707" width="630" height="122" rx="8" fill="#223b5c" /><text x="520" y="744" font-size="20" fill="#e6edf6" font-weight="600">同一套控件、同一个图标母版</text><text x="520" y="780" font-size="17" fill="#a5b4c7" font-weight="400">选中、焦点、错误与禁用状态在两种模式中保持可辨识。</text><rect x="1174" y="185" width="400" height="704" rx="12" fill="#1e2938" stroke="#3b4b61" /><text x="1198" y="224" font-size="22" fill="#e6edf6" font-weight="700">外观预览</text><rect x="1198" y="254" width="352" height="344" rx="12" fill="#192331" stroke="#3b4b61" /><text x="1218" y="292" font-size="22" fill="#e6edf6" font-weight="600">#1 电压曲线</text><rect x="1218" y="319" width="312" height="155" rx="6" fill="#eaf5f4" /><path d="M1230 459L1520 459" stroke="#b4d2d0" stroke-width="1" /><polyline points="1230,412.25 1273.2,412.25 1287.6,356.0 1316.4,431.0 1359.6,374.75 1402.8,384.75 1446.0,359.75 1480.56,402.25 1518,381.0" fill="none" stroke="#72d9c8" stroke-width="3" /><text x="1218" y="514" font-size="17" fill="#a5b4c7" font-weight="400">最近批次 · 1200 × 200</text><rect x="1218" y="538" width="312" height="42" rx="8" fill="#2364d2" /><text x="1234" y="566" font-size="18" fill="white" font-weight="600">截图并保存</text><text x="1198" y="647" font-size="18" fill="#a5b4c7" font-weight="400">截图示例保留原始颜色</text><text x="1198" y="687" font-size="17" fill="#a5b4c7" font-weight="400">当前图为合成概念，非软件截图</text><rect x="1198" y="762" width="352" height="42" rx="8" fill="#2364d2" /><text x="1214" y="790" font-size="18" fill="white" font-weight="600">应用设置</text></svg>