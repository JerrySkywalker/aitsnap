<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#151d29" /><rect x="0" y="0" width="1600" height="74" rx="0" fill="#1e2938" /><g transform="translate(22 15) scale(.68)"><rect width="64" height="64" rx="16" fill="#2364d2" /><g fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"><path d="M15 25V15h10M39 15h10v10M49 39v10H39M25 49H15V39" /><rect x="23" y="23" width="18" height="18" rx="3" /></g></g><text x="80" y="46" font-size="27" fill="#e6edf6" font-weight="700">AITSnap</text><text x="250" y="45" font-size="20" fill="#a5b4c7" font-weight="400">多屏证据工作台</text><text x="1110" y="44" font-size="17" fill="#a5b4c7" font-weight="400">概念草案 / 待审 · 合成示例 · 未实现</text><rect x="0" y="76" width="184" height="924" rx="0" fill="#192331" /><text x="32" y="131" font-size="20" fill="#a5b4c7" font-weight="400">工作台</text><rect x="12" y="160" width="160" height="46" rx="8" fill="#304e78" /><text x="32" y="191" font-size="20" fill="#82b4ff" font-weight="600">源区域</text><text x="32" y="251" font-size="20" fill="#a5b4c7" font-weight="400">拼图场景</text><text x="32" y="311" font-size="20" fill="#a5b4c7" font-weight="400">批次与报告</text><text x="32" y="371" font-size="20" fill="#a5b4c7" font-weight="400">设置</text><text x="23" y="903" font-size="13" fill="#a5b4c7" font-weight="400">图标为同一母版草案</text><text x="23" y="930" font-size="13" fill="#a5b4c7" font-weight="400">并非最终品牌批准</text><text x="214" y="122" font-size="30" fill="#e6edf6" font-weight="700">屏幕框选 · 名称与编号直接对应</text><text x="214" y="155" font-size="18" fill="#a5b4c7" font-weight="400">示例显示器 A · 所有标签位于编辑覆盖层，不写入截图</text><rect x="212" y="185" width="302" height="716" rx="12" fill="#1e2938" stroke="#3b4b61" /><text x="234" y="223" font-size="22" fill="#e6edf6" font-weight="700">这块屏幕上的区域</text><rect x="228" y="249" width="270" height="128" rx="12" fill="#edf4ff" stroke="#82b4ff" /><rect x="241" y="263" width="30" height="30" rx="9" fill="#2364d2" /><text x="250" y="285" font-size="18" fill="white" font-weight="700">1</text><text x="281" y="286" font-size="22" fill="#e6edf6" font-weight="600">电压曲线</text><text x="243" y="323" font-size="17" fill="#a5b4c7" font-weight="400">1200×200  ·  横向</text><text x="243" y="352" font-size="16" fill="#72d9c8" font-weight="400">启用  ·  该编号跨场景保持一致</text><rect x="228" y="393" width="270" height="128" rx="12" fill="#253347" stroke="#3b4b61" /><rect x="241" y="407" width="30" height="30" rx="9" fill="#2364d2" /><text x="250" y="429" font-size="18" fill="white" font-weight="700">2</text><text x="281" y="430" font-size="22" fill="#e6edf6" font-weight="600">串口日志</text><text x="243" y="467" font-size="17" fill="#a5b4c7" font-weight="400">600×480  ·  近方形</text><text x="243" y="496" font-size="16" fill="#72d9c8" font-weight="400">启用  ·  该编号跨场景保持一致</text><text x="236" y="589" font-size="17" fill="#a5b4c7" font-weight="400">选中区域名称</text><rect x="230" y="608" width="266" height="46" rx="7" fill="#1e2938" stroke="#3b4b61" /><text x="243" y="638" font-size="21" fill="#e6edf6" font-weight="400">电压曲线</text><rect x="230" y="678" width="266" height="42" rx="8" fill="#1e2938" stroke="#3b4b61" /><text x="246" y="706" font-size="18" fill="#e6edf6" font-weight="600">+ 添加区域</text><text x="233" y="767" font-size="17" fill="#a5b4c7" font-weight="400">高级：X / Y / 宽 / 高</text><text x="233" y="800" font-size="17" fill="#a5b4c7" font-weight="400">坐标参数保留为折叠面板</text><rect x="534" y="185" width="1040" height="716" rx="12" fill="#dae3ed" stroke="#3b4b61" /><text x="557" y="223" font-size="18" fill="#a5b4c7" font-weight="400">显示器 A   1920×1080   ·   150% 缩放示例</text><rect x="556" y="246" width="996" height="581" rx="6" fill="#c8d4e2" /><path d="M576 282L1528 282" stroke="#bbc9d8" stroke-width="1" /><path d="M576 366L1528 366" stroke="#bbc9d8" stroke-width="1" /><path d="M576 450L1528 450" stroke="#bbc9d8" stroke-width="1"