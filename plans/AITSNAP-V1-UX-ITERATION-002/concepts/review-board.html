<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AITSnap 下一轮界面概念审计</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#edf2f7;color:#17283d;font:16px "Microsoft YaHei UI",sans-serif}header{padding:22px 28px;background:white;border-bottom:1px solid #d9e2eb}h1{margin:0 0 9px;font-size:25px}p{margin:8px 0;color:#52677e}nav{display:flex;gap:10px;margin-top:16px}button{font:inherit;border:1px solid #b8c8da;border-radius:7px;background:white;color:#17345a;padding:10px 20px;cursor:pointer}button[aria-selected=true]{background:#2364d2;color:white;border-color:#2364d2}main{padding:16px}img{display:block;width:100%;height:auto;background:white;border-radius:10px}section[hidden]{display:none}a{color:#2364d2}</style>
<header><h1>AITSnap 下一轮 UI 概念审计</h1><p>合成示例 · 尚未实现或获得 Owner 批准。三屏四区域仅表达设计关系，不是现场监控截图。</p><p>审计重点：来源与输出是否清晰、编号名称能否对应、文字是否独立、是否接受稳定编号与高级参数折叠。</p><nav role="tablist"><button role="tab" id="tab0" aria-controls="panel0" aria-selected="true" onclick="show(0)">工作台总览</button><button role="tab" id="tab1" aria-controls="panel1" aria-selected="false" onclick="show(1)">多屏框选</button><button role="tab" id="tab2" aria-controls="panel2" aria-selected="false" onclick="show(2)">拼图编辑</button></nav></header><main><section role="tabpanel" id="panel0" aria-labelledby="tab0"><img src="01-workbench.svg" alt="AITSnap概念图：01-workbench"></section><section role="tabpanel" id="panel1" aria-labelledby="tab1" hidden><img src="02-region-selection.svg" alt="AITSnap概念图：02-region-selection"></section><section role="tabpanel" id="panel2" aria-labelledby="tab2" hidden><img src="03-scene-composer.svg" alt="AITSnap概念图：03-scene-composer"></section></main><script>function show(n){for(let i=0;i<3;i++){document.getElementById('panel'+i).hidden=i!==n;document.getElementById('tab'+i).setAttribute('aria-selected',String(i===n));}}document.querySelector('nav').addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const current=Array.from(document.querySelectorAll('button')).findIndex(b=>b.getAttribute('aria-selected')==='true');const n=(current+(e.key==='ArrowRight'?1:2))%3;show(n);document.getElementById('tab'+n).focus();});</script></html>
